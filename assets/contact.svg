<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" fill="none" role="img" aria-labelledby="title">
  <title id="title">Construyamos algo que importe. Abierto a proyectos y colaboraciones.</title>
  <defs></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="1280" height="260" rx="28" fill="#FFFFFF"/><text x="640" y="64" fill="#0071E3" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2.5">SIGUIENTE CAPÍTULO</text><text x="640" y="130" fill="#1D1D1F" font-size="48" font-weight="650" text-anchor="middle" letter-spacing="-1.8">Construyamos algo que importe.</text><text x="640" y="177" fill="#6E6E73" font-size="19" font-weight="400" text-anchor="middle">Una idea clara. Una conversación. Un buen comienzo.</text></g>
</svg>
