ght="600" letter-spacing="-0.5">Datos</text><text x="668" y="229" fill="#1D1D1F" font-size="13" font-weight="500" >MySQL · PostgreSQL</text><text x="668" y="252" fill="#6E6E73" font-size="11" font-weight="400" >Persistencia y consultas</text><rect x="955" y="141" width="280" height="131" rx="16" fill="#FFFFFF" stroke="#E1E4ED" /><text x="973" y="170" fill="#0071E3" font-size="10" font-weight="600" >04</text><text x="973" y="200" fill="#1D1D1F" font-size="21" font-weight="600" letter-spacing="-0.5">Infraestructura</text><text x="973" y="229" fill="#1D1D1F" font-size="13" font-weight="500" >AWS · Docker</text><text x="973" y="252" fill="#6E6E73" font-size="11" font-weight="400" >Despliegue y operación</text><text x="40" y="314" fill="#0071E3" font-size="10" font-weight="600" letter-spacing="1.4">IA APLICADA</text><text x="155" y="314" fill="#6E6E73" font-size="13" font-weight="400" >Gemini y MediaPipe, según las necesidades del producto.</text></g>
